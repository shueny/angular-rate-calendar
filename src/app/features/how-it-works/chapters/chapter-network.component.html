<section class="hiw-chapter" aria-labelledby="network-title">
  <header class="hiw-chapter-head">
    <p class="hiw-num">03</p>
    <h3 id="network-title">{{ t().title }}</h3>
    <p>{{ t().intro }}</p>
  </header>

  <figure class="hiw-fig">
    <div class="hiw-chips" role="group" [attr.aria-label]="t().scenarioLabel">
      @for (id of scenarioIds; track id) {
        <button
          type="button"
          class="hiw-btn scenario"
          [attr.data-scenario]="id"
          [attr.aria-pressed]="scenario() === id"
          (click)="run(id)"
        >
          {{ t().scenarios[id].label }}
        </button>
      }
      <button type="button" class="hiw-btn replay" (click)="replay()">↻ {{ t().replay }}</button>
    </div>
    <p class="desc">{{ t().scenarios[scenario()].desc }}</p>

    <div class="seq" [attr.aria-busy]="running()">
      <div class="lanes">
        <span></span>
        @for (lane of lanes; track lane) {
          <span>{{ t().lanes[lane] }}</span>
        }
      </div>
      <ol class="rows" aria-live="polite">
        @for (r of view(); track r.id) {
          <li class="row" [class]="'tone-' + r.tone">
            <span class="time">{{ (r.t / 1000).toFixed(2) }}s</span>
            <div class="track">
              <div
                class="lbl"
                [style.padding-left.%]="r.from === r.to ? laneCenter(r.lo) - 1 : laneCenter(r.lo)"
              >
                @if (r.code) {
                  <code>{{ r.code }}</code>
                }
                @if (r.text) {
                  <span>{{ r.text }}</span>
                }
              </div>
              @if (r.from === r.to) {
                <i class="dot" [style.left.%]="laneCenter(r.lo)"></i>
              } @else {
                <i
                  class="arrow"
                  [class.back]="r.to < r.from"
                  [style.left.%]="laneCenter(r.lo)"
                  [style.width.%]="(r.hi - r.lo) * 25"
                ></i>
              }
            </div>
          </li>
        }
      </ol>
    </div>

    <div class="panels">
      <div class="panel">
        <p class="hiw-label">{{ t().inFlight }}</p>
        @for (p of pending(); track p.id) {
          <div class="req">
            <code>{{ p.country }}</code>
            <span class="bar"><i [style.width.%]="(age(p) / 10000) * 100"></i></span>
            <span class="secs">{{ (age(p) / 1000).toFixed(1) }}s</span>
          </div>
        } @empty {
          <p class="empty">—</p>
        }
      </div>
      @if (service(); as svc) {
        <dl class="panel state">
          <dt>{{ t().picked }}</dt>
          <dd class="picked">{{ svc.countryCode() }}</dd>
          <dt>{{ t().showing }}</dt>
          <dd class="showing">
            @if (svc.holidays().length) {
              {{ svc.holidays().length }} × {{ svc.holidays()[0].countryCode }}
            } @else {
              {{ t().none }}
            }
          </dd>
          <dt>loading()</dt>
          <dd>{{ svc.loading() }}</dd>
          <dt>error()</dt>
          <dd class="error">{{ svc.error() ?? 'null' }}</dd>
        </dl>
      }
    </div>

    <figcaption>{{ t().caption }}</figcaption>
  </figure>

  <p class="hiw-takeaway">{{ t().takeaway }}</p>
</section>
