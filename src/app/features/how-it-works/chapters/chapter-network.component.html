<section class="hiw-chapter" aria-labelledby="ch3-title">
  <header class="hiw-chapter-head">
    <span class="hiw-kicker">{{ t().ch3.kicker }}</span>
    <h3 id="ch3-title">{{ t().ch3.title }}</h3>
    <p>{{ t().ch3.lede }}</p>
  </header>

  <figure class="hiw-fig" [appAutoplay]="timeline">
    <div class="hiw-fig-head">
      <span class="hiw-fig-label">{{ t().ch3.fig }}</span>
      <div class="hiw-chips" role="group" [attr.aria-label]="t().f3.scenario">
        @for (id of scenarioIds; track id) {
          <button
            type="button"
            class="hiw-chip"
            [attr.data-scenario]="id"
            [attr.aria-pressed]="scenario() === id"
            (click)="pickScenario(id)"
          >
            {{ labels[id][lang() === 'zh' ? 1 : 0] }}
          </button>
        }
      </div>
    </div>

    <div class="hiw-stage">
      <svg class="hiw-svg" [attr.viewBox]="frame().vb" role="img" [attr.aria-label]="caption()">
        <g [attr.transform]="frame().offset">
          @for (f of frame().frames; track $index) {
            <rect
              [attr.x]="f.x"
              [attr.y]="f.y"
              [attr.width]="f.w"
              [attr.height]="f.h"
              rx="12"
              [attr.fill]="f.fill"
              [attr.stroke]="f.stroke"
              stroke-width="1"
              [attr.stroke-dasharray]="f.dash"
            />
          }
          <path
            [attr.d]="frame().boundary"
            stroke="#b9b6ad"
            stroke-width="1.5"
            stroke-dasharray="6 5"
            fill="none"
          />
          @for (r of frame().rails; track $index) {
            <path
              [attr.d]="r.d"
              stroke="#e2e0da"
              stroke-width="1.5"
              stroke-dasharray="3 6"
              fill="none"
            />
            <path
              [attr.d]="r.arrow"
              stroke="#c9c6bd"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          }
          @for (st of frame().stations; track st.k) {
            <g class="station" [attr.data-station]="st.k">
              <rect
                [attr.x]="st.x"
                [attr.y]="st.y"
                [attr.width]="st.w"
                [attr.height]="st.h"
                rx="10"
                [attr.fill]="st.fill"
                [attr.stroke]="st.stroke"
                stroke-width="1.5"
                [attr.stroke-dasharray]="st.dash"
              />
              @if (st.ring; as ring) {
                <circle
                  [attr.cx]="ring.x"
                  [attr.cy]="ring.y"
                  r="7"
                  fill="none"
                  stroke="#e2e0da"
                  stroke-width="3"
                />
                <circle
                  class="ring"
                  [attr.cx]="ring.x"
                  [attr.cy]="ring.y"
                  r="7"
                  fill="none"
                  stroke="#a15c00"
                  stroke-width="3"
                  pathLength="100"
                  stroke-dasharray="100 100"
                  [attr.stroke-dashoffset]="ring.offset"
                  [attr.transform]="'rotate(-90 ' + ring.x + ' ' + ring.y + ')'"
                />
              }
            </g>
          }
          @if (frame().shield; as sh) {
            <g class="shield" [attr.transform]="sh.transform" [attr.opacity]="sh.op">
              <rect
                [attr.x]="sh.bar.x"
                [attr.y]="sh.bar.y"
                [attr.width]="sh.bar.w"
                [attr.height]="sh.bar.h"
                rx="2"
                [attr.fill]="sh.color"
              />
              <g [attr.transform]="sh.icon">
                <path
                  d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
                  fill="#ffffff"
                  [attr.stroke]="sh.color"
                  stroke-width="2"
                />
              </g>
            </g>
          }
          @for (p of frame().packets; track $index) {
            <g class="packet" [attr.transform]="p.transform" [attr.opacity]="p.op">
              <rect
                [attr.x]="-p.w / 2"
                y="-14"
                [attr.width]="p.w"
                height="28"
                rx="4"
                [attr.fill]="p.fill"
                [attr.stroke]="p.stroke"
                stroke-width="1.5"
              />
              <path
                [attr.d]="p.flap"
                fill="none"
                [attr.stroke]="p.stroke"
                stroke-width="1"
                opacity="0.45"
              />
            </g>
          }
          @for (fr of frame().frags; track $index) {
            <rect
              [attr.x]="fr.x"
              [attr.y]="fr.y"
              width="12"
              height="8"
              rx="1.5"
              fill="#ffffff"
              [attr.stroke]="fr.color"
              stroke-width="1.5"
              [attr.opacity]="fr.op"
              [attr.transform]="'rotate(' + fr.rot + ' ' + fr.cx + ' ' + fr.cy + ')'"
            />
          }
          @for (tx of frame().texts; track $index) {
            <text
              [attr.x]="tx.x"
              [attr.y]="tx.y"
              [attr.text-anchor]="tx.anchor ?? 'middle'"
              [attr.font-size]="tx.size"
              [attr.font-weight]="tx.weight ?? null"
              [attr.letter-spacing]="tx.ls ?? null"
              [attr.fill]="tx.fill"
              [attr.opacity]="tx.op ?? null"
              [class.sans]="tx.sans"
              [class.halo]="tx.halo"
            >
              {{ tx.text }}
            </text>
          }
        </g>
      </svg>
    </div>

    <div class="state">
      <span class="hiw-mini">{{ t().f3.stateTitle }}</span>
      <div class="card">
        @for (c of frame().card; track c.cls) {
          <div class="cell" [class]="c.cls">
            <span class="hiw-mini">{{ c.label }}</span>
            <b [style.color]="c.color">{{ c.value }}</b>
          </div>
        }
      </div>
    </div>

    <app-player [timeline]="timeline" [caption]="caption()" [lang]="lang()" />

    <div class="hiw-details">
      <button
        type="button"
        class="hiw-details-toggle"
        [attr.aria-expanded]="open()"
        (click)="open.set(!open())"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
        {{ open() ? t().hideDetails : t().details }}
      </button>
      @if (open()) {
        <div class="hiw-log">
          <span class="hiw-mini">{{ t().log }}</span>
          @for (l of frame().log; track $index) {
            <div class="row" [class.done]="l.done">
              <span>{{ l.t }}</span>
              <span>{{ l.text }}</span>
            </div>
          }
        </div>
      }
    </div>
  </figure>
</section>
