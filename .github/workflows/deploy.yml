name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx ng build --base-href /angular-rate-calendar/
      # GitHub Pages has no SPA fallback; serving index.html as 404.html lets
      # deep links like /how-it-works load the app, which then routes them.
      - run: cp dist/angular-rate-calendar/browser/index.html dist/angular-rate-calendar/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-rate-calendar/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
